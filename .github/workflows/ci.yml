name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and static checks
        run: npm run check

      - name: Smoke tests
        run: npm run test:all

      - name: Deployment checks
        run: npm run check:deployment

      - name: Windows launcher and development smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\windows\ci-smoke.ps1
